name: AWS release candidate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: focusai-aws-${{ github.ref }}
  cancel-in-progress: false
jobs:
  security:
    uses: ./.github/workflows/security-gate.yml
  verify:
    needs: ["security"]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Runtime image security gate regressions
        run: python -m unittest discover -s scripts/security -p test_image_gate.py -v
      - run: npm ci
      - run: npm run lint && npm run test:server && npm run test:bot
      - run: python3 -B -m unittest discover -s deploy -p 'test_*.py'
      - name: Build immutable web image
        run: |
          mkdir -p .omo/evidence
          /usr/bin/time -v -o .omo/evidence/build-process-time.txt docker build -f deploy/aws.Dockerfile --build-arg REVISION="$GITHUB_SHA" -t "focusai:$GITHUB_SHA" .
      - name: Gate the exact web runtime OS and Node libraries
        run: |
          docker run --rm --network none --entrypoint sh "focusai:$GITHUB_SHA" -ec 'test -s /etc/alpine-release; for tool in npm npx yarn yarnpkg; do test -z "$(command -v "$tool")"; done; node --version >/dev/null'
          docker run --rm --network none --entrypoint node "focusai:$GITHUB_SHA" --input-type=module -e 'await import("mariadb"); await import("discord.js")'
          image_id=$(docker image inspect "focusai:$GITHUB_SHA" --format '{{.Id}}')
          bash scripts/security/scan-image.sh "$image_id"
      - name: Fresh schema, auth, persistence and runtime memory
        env:
          FOCUSAI_IMAGE: focusai:${{ github.sha }}
          FOCUSAI_TEST_OUTPUT: .omo/evidence/compose-integration.json
        run: node scripts/test-aws-compose.mjs
      - name: Export verified image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          docker save "focusai:$GITHUB_SHA" | gzip > .omo/evidence/focusai-image.tar.gz
          sha256sum .omo/evidence/focusai-image.tar.gz > .omo/evidence/focusai-image.sha256
          printf '%s\n' "$GITHUB_SHA" > .omo/evidence/revision.txt
          sha256sum server/src/mariadb.ts > .omo/evidence/schema-source.sha256
      - name: Publish release artifact for server pull
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: focusai-app-${{ github.sha }}
          path: |
            .omo/evidence/focusai-image.tar.gz
            .omo/evidence/focusai-image.sha256
            .omo/evidence/revision.txt
            .omo/evidence/schema-source.sha256
          retention-days: 7
      - name: Publish safe validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: focusai-validation-${{ github.sha }}
          path: |
            .omo/evidence/compose-integration.json
            .omo/evidence/build-process-time.txt
          if-no-files-found: error
